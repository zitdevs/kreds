name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The repository tests run against a real Postgres. The things worth
    # checking there, unique constraints, upserts and transactions, are exactly
    # the things a fake would not have.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kreds
          POSTGRES_PASSWORD: kreds
          POSTGRES_DB: kreds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kreds -d kreds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kreds:kreds@localhost:5432/kreds_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from the "packageManager" field in package.json.
      # Setting it here as well makes the action fail with a version mismatch.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
